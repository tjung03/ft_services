apiVersion: apps/v1
kind: Deployment
metadata:
    name: phpmyadmin42
    labels:
        app: phpmyadmin42
spec:
    replicas: 1
    selector:
        matchLabels:
            app: phpmyadmin42
    template:
        metadata:
            labels:
                app: phpmyadmin42
        spec:
            containers:
                - name: phpmyadmin42
                  imagePullPolicy: Never
                  image: phpmyadmin42
                  ports:
                      - name: phpmyadmin
                        containerPort: 5000
                        protocol: TCP
                  livenessProbe:
                      httpGet:
                          path: /
                          port: 5000

---
apiVersion: v1
kind: Service
metadata:
    name: phpmyadmin42
    labels:
        app: phpmyadmin42
    annotations:
        metallb.universe.tf/allow-shared-ip: shared
spec:
    type: LoadBalancer
    ports:
        - name: phpmyadmin
          port: 5000
          protocol: TCP
          targetPort: 5000
    selector:
        app: phpmyadmin42
