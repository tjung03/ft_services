apiVersion: apps/v1
kind: Deployment
metadata:
    name: mysql42
    labels:
        app: mysql42
spec:
    replicas: 1
    selector:
        matchLabels:
            app: mysql42
    template:
        metadata:
            labels:
                app: mysql42
        spec:
            containers:
                - name: mysql42
                  imagePullPolicy: Never
                  image: mysql42
                  ports:
                      - containerPort: 3306
                        name: mysql
                        protocol: TCP
                  volumeMounts:
                      - mountPath: /var/lib/mysql
                        name: mysql-pv
            volumes:
                - name: mysql-pv
                  persistentVolumeClaim:
                      claimName: mysql-pv

---
apiVersion: v1
kind: Service
metadata:
    name: mysql42
    labels:
        app: mysql42
    annotations:
        metallb.universe.tf/allow-shared-ip: shared
spec:
    type: ClusterIP
    ports:
        - name: mysql
          port: 3306
          protocol: TCP
          targetPort: 3306
    selector:
        app: mysql42

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
    name: mysql-pv
    labels:
        app: mysql42
spec:
    accessModes:
        - ReadWriteOnce
    resources:
        requests:
            storage: 2Gi
